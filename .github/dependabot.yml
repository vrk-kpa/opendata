version: 2
registries:
  npm-registry-npm-fontawesome-com:
    type: npm-registry
    url: https://npm.fontawesome.com
    token: "${{secrets.NPM_TOKEN}}"
    scope: "@fortawesome"
  python-index-alpine-wheels:
    type: python-index
    url: https://alpine-wheels.github.io

updates:
- package-ecosystem: "pip"
  directory: "/ckan/"
  cooldown:
    default-days: 7
  schedule:
    interval: "daily"
  registries:
   - python-index-alpine-wheels
  insecure-external-code-execution: allow
  open-pull-requests-limit: 10

- package-ecosystem: "docker"
  directory: "/ckan/"
  cooldown:
    default-days: 7
  schedule:
    interval: "monthly"

- package-ecosystem: "docker"
  directory: "/docker/solr/"
  cooldown:
    default-days: 7
  schedule:
    interval: "monthly"

- package-ecosystem: "docker"
  directory: "/docker/nginx/"
  cooldown:
    default-days: 7
  schedule:
    interval: "monthly"

- package-ecosystem: "docker"
  directory: "/docker/postgres/"
  cooldown:
    default-days: 7
  schedule:
    interval: "monthly"

- package-ecosystem: "docker"
  directory: "/docker/datapusher-plus/"
  cooldown:
    default-days: 7
  schedule:
    interval: "monthly"

- package-ecosystem: "docker"
  directory: "/drupal/"
  cooldown:
    default-days: 7
  schedule:
    interval: "monthly"

- package-ecosystem: "docker"
  directory: "/cypress/"
  patterns: ['*']
  cooldown:
    default-days: 7
  multi-ecosystem-group: "cypress"

- package-ecosystem: "npm"
  directory: "/"
  patterns: ['cypress']
  cooldown:
    default-days: 7
  multi-ecosystem-group: "cypress"

- package-ecosystem: "npm"
  directories:
    - "/opendata-assets/"
    - "/drupal/modules/avoindata-ckeditor5-plugins"
  cooldown:
    default-days: 7
  schedule:
    interval: "daily"
    time: "03:00"
  open-pull-requests-limit: 10
  registries:
    - npm-registry-npm-fontawesome-com
  ignore:
    # fontawesome version updates are dictated by CKAN
    - dependency-name: "@fortawesome/fontawesome-pro"
      versions:
      - ">=6"

- package-ecosystem: "composer"
  directory: "/drupal/"
  cooldown:
    default-days: 7
  schedule:
    interval: "daily"
    time: "03:00"
  groups:
    drupal:
      applies-to: security-updates
      dependency-type: production
      update-types:
        - patch

- package-ecosystem: "npm"
  directory: "/cdk/"
  cooldown:
    default-days: 7
  schedule:
    interval: "daily"
    time: "03:00"
  open-pull-requests-limit: 10

- package-ecosystem: "github-actions"
  directory: "/"
  cooldown:
    default-days: 7
  schedule:
    # Check for updates to GitHub Actions every week
    interval: "weekly"
  groups:
    actions:
      patterns:
        - '*'

multi-ecosystem-groups:
  cypress:
    schedule:
      interval: "weekly"
