version: 2
registries:
  npm-registry-npm-fontawesome-com:
    type: npm-registry
    url: https://npm.fontawesome.com
    token: "${{secrets.NPM_TOKEN}}"

updates:
- package-ecosystem: "pip"
  directory: "/ckan/"
  patterns: ['*']
  schedule:
    interval: "daily"
  open-pull-requests-limit: 10

- package-ecosystem: "docker"
  directory: "/ckan/"
  patterns: ['*']
  schedule:
    interval: "monthly"

- package-ecosystem: "docker"
  directory: "/docker/solr/"
  schedule:
    interval: "monthly"

- package-ecosystem: "docker"
  directory: "/docker/nginx/"
  schedule:
    interval: "monthly"

- package-ecosystem: "docker"
  directory: "/docker/postgres/"
  schedule:
    interval: "monthly"

- package-ecosystem: "docker"
  directory: "/docker/datapusher-plus/"
  schedule:
    interval: "monthly"

- package-ecosystem: "docker"
  directory: "/drupal/"
  patterns: ['*']
  schedule:
    interval: "monthly"

- package-ecosystem: "docker"
  directory: "/cypress/"
  patterns: ['*']
  multi-ecosystem-group: "cypress"

- package-ecosystem: "npm"
  directory: "/"
  patterns: ['cypress']
  multi-ecosystem-group: "cypress"

- package-ecosystem: "npm"
  directory: "/opendata-assets/"
  schedule:
    interval: "daily"
    time: "03:00"
  open-pull-requests-limit: 10
  registries:
  - npm-registry-npm-fontawesome-com

- package-ecosystem: "composer"
  directory: "/drupal/"
  multi-ecosystem-group: "drupal"
  patterns: ['*']
  groups:
    drupal:
      applies-to: security-updates
      dependency-type: production
      update-types:
        - patch

- package-ecosystem: "npm"
  directory: "/cdk/"
  schedule:
    interval: "daily"
    time: "03:00"
  open-pull-requests-limit: 10

- package-ecosystem: "github-actions"
  directory: "/"
  schedule:
    # Check for updates to GitHub Actions every week
    interval: "weekly"
  groups:
    actions:
      patterns:
        - '*'

multi-ecosystem-groups:
  cypress:
    schedule:
      interval: "weekly"
